# Builds the native SIP library (pjsip + Jio patches + AMR-WB + OpenSSL) and the APK on GitHub's
# servers, so you don't need Android tools on your computer. Put this project in your own GitHub
# repo, open the "Actions" tab, run "Build APK" and download the APK from the run's artifacts.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build libjiosip.so (arm64-v8a = nearly every phone made since ~2016)
        run: |
          chmod +x native/build.sh gradlew
          ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" ./native/build.sh arm64-v8a      # add armeabi-v7a here for very old 32-bit phones
      - name: Build APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JioFiberCalling-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
